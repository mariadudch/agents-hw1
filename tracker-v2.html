<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мини-трекер учёбы на неделю</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: #1f2328;
    background: #f6f7f9;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 0 0 8px; }
  section {
    background: #fff;
    border: 1px solid #d8dde3;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .summary-line { margin: 0 0 8px; font-weight: 600; overflow-wrap: anywhere; }
  progress { display: block; width: 100%; height: 12px; }
  .field { margin-bottom: 10px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type="text"] {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 10px;
    font: inherit;
    border: 1px solid #8c959f;
    border-radius: 8px;
  }
  input[aria-invalid="true"] { border-color: #b42318; background: #fff7f6; }
  .error { color: #b42318; font-size: 0.9rem; margin: 4px 0 0; min-height: 1.3em; }
  button {
    font: inherit;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #1f6feb;
    background: #1f6feb;
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: #fff; color: #b42318; border-color: #b42318; padding: 6px 10px; }
  button:focus-visible, input:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
  fieldset { border: 0; margin: 0 0 10px; padding: 0; min-width: 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .radios { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .radio, .task-done { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
  input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; margin: 0; flex: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 10px 0;
    border-top: 1px solid #eceff2;
  }
  li:first-child { border-top: 0; }
  .task-title { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
  li.done .task-title { text-decoration: line-through; color: #57606a; }
  .task-hours { white-space: nowrap; color: #57606a; }
  .empty { color: #57606a; margin: 0; }
  .notice {
    background: #fff8e1;
    border: 1px solid #e0b100;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 14px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Учебные задачи на неделю</h1>

  <div id="storage-notice" class="notice" role="status" hidden></div>

  <section aria-labelledby="summary-heading">
    <h2 id="summary-heading">Итоги</h2>
    <p class="summary-line" id="summary" aria-live="polite"></p>
    <progress id="progress-bar" max="100" value="0" aria-label="Прогресс выполнения"></progress>
  </section>

  <section aria-labelledby="add-heading">
    <h2 id="add-heading">Новая задача</h2>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="title">Название</label>
        <input type="text" id="title" name="title" autocomplete="off" aria-describedby="title-error">
        <p class="error" id="title-error" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="hours">Часы (от 0,5 до 24, шаг 0,5)</label>
        <input type="text" id="hours" name="hours" inputmode="decimal" autocomplete="off" aria-describedby="hours-error">
        <p class="error" id="hours-error" aria-live="polite"></p>
      </div>
      <button type="submit">Добавить</button>
    </form>
  </section>

  <section aria-labelledby="list-heading">
    <h2 id="list-heading" tabindex="-1">Задачи</h2>
    <fieldset>
      <legend>Фильтр</legend>
      <div class="radios">
        <label class="radio"><input type="radio" name="filter" value="all" checked> Все</label>
        <label class="radio"><input type="radio" name="filter" value="active"> Активные</label>
      </div>
    </fieldset>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden></p>
  </section>
</main>

<script>
'use strict';

// DOMAIN START — чистая логика без DOM
const Domain = (() => {
  const SEED = Object.freeze([
    Object.freeze({ id: 't1', title: 'Чтение', hours: 2, done: true }),
    Object.freeze({ id: 't2', title: 'Практика', hours: 4, done: false }),
    Object.freeze({ id: 't3', title: 'Повторение', hours: 2, done: false })
  ]);

  function seed() {
    return SEED.map(t => ({ ...t }));
  }

  function isValidHours(h) {
    return typeof h === 'number' && Number.isFinite(h) &&
      h >= 0.5 && h <= 24 && Number.isInteger(h * 2);
  }

  const NUMBER_FORMAT = /^-?\d+(?:[.,]\d+)?$/;

  function validate({ titleRaw, hoursRaw }) {
    const errors = {};
    const title = String(titleRaw ?? '').trim();
    if (title === '') errors.title = 'Введите название задачи.';

    const hoursText = String(hoursRaw ?? '').trim();
    let hours = NaN;
    if (hoursText === '') {
      errors.hours = 'Укажите часы: пустое поле не считается нулём.';
    } else if (!NUMBER_FORMAT.test(hoursText)) {
      errors.hours = 'Часы должны быть числом, например 1,5.';
    } else {
      hours = Number(hoursText.replace(',', '.'));
      if (!Number.isFinite(hours)) {
        errors.hours = 'Часы должны быть числом, например 1,5.';
      } else if (hours < 0.5 || hours > 24) {
        errors.hours = 'Часы должны быть от 0,5 до 24.';
      } else if (!Number.isInteger(hours * 2)) {
        errors.hours = 'Шаг — 0,5 часа (например, 1 или 1,5).';
      }
    }

    const ok = Object.keys(errors).length === 0;
    return ok ? { ok, errors, value: { title, hours } } : { ok, errors };
  }

  function makeId(tasks) {
    let id;
    do {
      id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    } while (tasks.some(t => t.id === id));
    return id;
  }

  function addTask(tasks, { title, hours }) {
    return [...tasks, { id: makeId(tasks), title, hours, done: false }];
  }

  function removeTask(tasks, id) {
    return tasks.filter(t => t.id !== id);
  }

  function toggleDone(tasks, id) {
    return tasks.map(t => (t.id === id ? { ...t, done: !t.done } : t));
  }

  // Итоги всегда считаются по полному списку задач, не по отфильтрованному.
  function totals(tasks) {
    let totalHours = 0;
    let doneHours = 0;
    for (const t of tasks) {
      totalHours += t.hours;
      if (t.done) doneHours += t.hours;
    }
    const progress = totalHours === 0 ? 0 : Math.round(100 * doneHours / totalHours);
    return { totalHours, doneHours, progress };
  }

  function visible(tasks, filter) {
    return filter === 'active' ? tasks.filter(t => !t.done) : tasks.slice();
  }

  function isValidTaskList(x) {
    if (!Array.isArray(x)) return false;
    const ids = new Set();
    for (const t of x) {
      if (!t || typeof t !== 'object') return false;
      if (typeof t.id !== 'string' || t.id === '' || ids.has(t.id)) return false;
      ids.add(t.id);
      if (typeof t.title !== 'string' || t.title.trim() === '') return false;
      if (!isValidHours(t.hours)) return false;
      if (typeof t.done !== 'boolean') return false;
    }
    return true;
  }

  return { seed, validate, addTask, removeTask, toggleDone, totals, visible, isValidTaskList };
})();
// DOMAIN END

// STORAGE — необязательное улучшение: localStorage с откатом в память
const STORAGE_KEY = 'tracker-v2.tasks';
const UNAVAILABLE_MSG = 'Сохранение недоступно, данные живут до закрытия страницы.';

const Storage = {
  available: true,

  load() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw === null) return { tasks: Domain.seed(), note: null };
      let parsed = null;
      try { parsed = JSON.parse(raw); } catch (_) { parsed = null; }
      if (Domain.isValidTaskList(parsed)) {
        return {
          tasks: parsed.map(t => ({ id: t.id, title: t.title, hours: t.hours, done: t.done })),
          note: null
        };
      }
      // Невалидные или чужие данные под ключом: не перезаписываем их, работаем в памяти.
      this.available = false;
      return { tasks: Domain.seed(), note: UNAVAILABLE_MSG };
    } catch (_) {
      this.available = false;
      return { tasks: Domain.seed(), note: UNAVAILABLE_MSG };
    }
  },

  save(tasks) {
    if (!this.available) return null;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      return null;
    } catch (_) {
      this.available = false;
      return UNAVAILABLE_MSG;
    }
  }
};

// APP — DOM и события
const state = { tasks: [], filter: 'all' };

const el = {
  notice: document.getElementById('storage-notice'),
  summary: document.getElementById('summary'),
  bar: document.getElementById('progress-bar'),
  form: document.getElementById('add-form'),
  title: document.getElementById('title'),
  hours: document.getElementById('hours'),
  titleErr: document.getElementById('title-error'),
  hoursErr: document.getElementById('hours-error'),
  listHeading: document.getElementById('list-heading'),
  list: document.getElementById('list'),
  empty: document.getElementById('empty')
};

function fmt(h) {
  return h.toLocaleString('ru-RU', { maximumFractionDigits: 1 });
}

function setNotice(msg) {
  if (msg) {
    el.notice.textContent = msg;
    el.notice.hidden = false;
  }
}

function commit(nextTasks) {
  state.tasks = nextTasks;
  setNotice(Storage.save(state.tasks));
  render();
}

function showError(input, errEl, msg) {
  errEl.textContent = msg || '';
  if (msg) input.setAttribute('aria-invalid', 'true');
  else input.removeAttribute('aria-invalid');
}

function renderItem(t) {
  const li = document.createElement('li');
  li.dataset.id = t.id;
  if (t.done) li.classList.add('done');

  const doneLabel = document.createElement('label');
  doneLabel.className = 'task-done';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = t.done;
  cb.dataset.action = 'toggle';
  cb.setAttribute('aria-label', 'Готово: ' + t.title);
  doneLabel.append(cb, document.createTextNode('Готово'));

  const title = document.createElement('span');
  title.className = 'task-title';
  title.textContent = t.title;

  const hours = document.createElement('span');
  hours.className = 'task-hours';
  hours.textContent = fmt(t.hours) + ' ч';

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'secondary';
  del.dataset.action = 'remove';
  del.textContent = 'Удалить';
  del.setAttribute('aria-label', 'Удалить: ' + t.title);

  li.append(doneLabel, title, hours, del);
  return li;
}

function render() {
  const { totalHours, doneHours, progress } = Domain.totals(state.tasks);
  el.summary.textContent =
    'Всего ' + fmt(totalHours) + ' ч · выполнено ' + fmt(doneHours) + ' ч · прогресс ' + progress + '%';
  el.bar.value = progress;

  const items = Domain.visible(state.tasks, state.filter);
  el.list.replaceChildren(...items.map(renderItem));
  el.empty.hidden = items.length > 0;
  el.empty.textContent = state.tasks.length === 0 ? 'Задач нет.' : 'Нет задач для выбранного фильтра.';
}

el.form.addEventListener('submit', e => {
  e.preventDefault();
  const r = Domain.validate({ titleRaw: el.title.value, hoursRaw: el.hours.value });
  showError(el.title, el.titleErr, r.errors.title);
  showError(el.hours, el.hoursErr, r.errors.hours);
  if (!r.ok) {
    (r.errors.title ? el.title : el.hours).focus();
    return; // значения формы не трогаем
  }
  commit(Domain.addTask(state.tasks, r.value));
  el.form.reset();
  el.title.focus();
});

el.list.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.action !== 'toggle') return;
  const id = t.closest('li').dataset.id;
  commit(Domain.toggleDone(state.tasks, id));
});

el.list.addEventListener('click', e => {
  const btn = e.target.closest('button[data-action="remove"]');
  if (!btn) return;
  const id = btn.closest('li').dataset.id;
  commit(Domain.removeTask(state.tasks, id));
  el.listHeading.focus();
});

document.querySelectorAll('input[name="filter"]').forEach(radio => {
  radio.addEventListener('change', () => {
    if (radio.checked) {
      state.filter = radio.value;
      render();
    }
  });
});

(function init() {
  const { tasks, note } = Storage.load();
  state.tasks = tasks;
  setNotice(note);
  render();
})();
</script>
</body>
</html>
